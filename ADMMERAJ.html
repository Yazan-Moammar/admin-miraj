<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Miraç Admin — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --primary: #0f172a; --accent: #3b82f6;
  --gold: #d97706; --red: #ef4444; --green: #10b981; --border: #e2e8f0;
  --text: #334155; --muted: #64748b; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; width: 100%; max-width: 100vw; overflow-x: hidden; }

/* Login */
#loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--primary); padding: 15px;}
.login-box { background: var(--card); border-radius: 16px; padding: 30px 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); text-align: center; }
.login-box h1 { font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 20px; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; background: #f8fafc; font-size: 15px;}
.login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; }
.login-err { color: var(--red); font-size: 13px; margin-top: 10px; font-weight: 700; }

/* Dashboard */
#dashboard { display: none; }
.topbar { background: var(--card); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 18px; font-weight: 900; color: var(--primary); }
.topbar h1 span { color: var(--accent); }
.logout-btn { padding: 6px 12px; background: #fee2e2; color: var(--red); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px;}

.container { max-width: 1200px; margin: 15px auto; padding: 0 10px; }
.tabs { display: flex; background: var(--card); border-radius: 12px; padding: 5px; gap: 5px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); flex-wrap: wrap;}
.tab-btn { flex: 1; padding: 10px 5px; border: none; background: transparent; font-weight: 700; font-size: 13px; color: var(--muted); border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap;}
.tab-btn.active { background: var(--primary); color: white; }
.view { display: none; }
.view.active { display: block; }

/* Toolbar */
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
.search-box { flex: 1; min-width: 100%; position: relative; }
.search-box input { width: 100%; padding: 10px 35px 10px 15px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px;}
.search-box::before { content: '🔍'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 14px;}
.btn { padding: 10px 15px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; font-family: inherit; font-size: 14px; width: 100%;}
.btn-pdf { background: #fef2f2; color: var(--red); border: 1px solid #fca5a5; }
.btn-add { background: var(--primary); color: white; }

/* Orders */
.order-card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid var(--border); overflow: hidden; }
.order-header { background: #f1f5f9; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 5px;}
.order-id { font-weight: 900; color: var(--primary); font-size: 14px;}
.order-date { font-size: 11px; color: var(--muted); }
.order-body { padding: 15px; display: grid; grid-template-columns: 1fr; gap: 15px; }
.order-details-col p { margin-bottom: 8px; font-size: 13px; }
.order-details-col p strong { color: var(--muted); font-size: 11px; display: block; }
.order-items-col { background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px dashed var(--border); }
.item-line { display: flex; justify-content: space-between; font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px; flex-wrap: wrap;}
.item-line:last-child { border: none; margin: 0; padding: 0; }
.order-footer { padding: 12px 15px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.total-box { font-size: 15px; font-weight: 900; color: var(--green); text-align: center;}
.action-btns { display: flex; gap: 8px; width: 100%;}
.wa-btn { flex:1; padding: 10px; background: #25d366; color: white; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; }
.del-btn { flex:1; padding: 10px; background: #fee2e2; color: var(--red); border: 1px solid #fca5a5; border-radius: 8px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;}

/* Products */
.products-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
.product-card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
.p-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid var(--border); }
.p-info { padding: 12px; }
.p-title { font-weight: 800; margin-bottom: 5px; color: var(--primary); font-size: 15px;}
.p-price { color: var(--gold); font-weight: 900; margin-bottom: 8px; font-size: 16px;}
.p-stock { font-size: 12px; font-weight: 700; margin-bottom: 10px; }
.p-stock.in { color: var(--green); }
.p-stock.out { color: var(--red); }
.p-actions { display: flex; gap: 8px; }
.p-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px;}
.btn-edit { background: #e0f2fe; color: #0284c7; }
.btn-del-p { background: #fee2e2; color: var(--red); }

/* Table */
.table-wrap { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow-x: auto; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; text-align: right; min-width: 500px;}
th { background: #f8fafc; padding: 12px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); font-size: 12px;}
td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 12px;}

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; }
.modal.open { display: flex; }
.modal-content { background: var(--card); border-radius: 16px; padding: 20px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
.modal-content h2 { margin-bottom: 15px; color: var(--primary); font-size: 18px;}
.form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 12px; font-weight: 700; color: var(--muted); }
.form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px;}
.checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
.checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
.checkbox-group label { font-size: 14px; font-weight: 700; color: var(--primary); cursor: pointer; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.btn-cancel { padding: 10px 15px; background: #f1f5f9; color: var(--muted); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%;}
.btn-save { padding: 10px 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%;}

/* --- إعدادات الجوال (Mobile Responsive) --- */
@media (min-width: 600px) {
  .search-box { min-width: 250px; width: auto; }
  .btn { width: auto; }
  .tabs { flex-wrap: nowrap; }
  .tab-btn { font-size: 15px; }
  .order-body { grid-template-columns: 1fr 1fr; }
  .order-footer { flex-direction: row; justify-content: space-between; }
  .action-btns { width: auto; }
  .total-box { text-align: right; }
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-group.full { grid-column: 1 / -1; }
  .modal-actions { justify-content: flex-end; }
  .btn-cancel, .btn-save { width: auto; }
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Miraç Admin</h1>
    <input type="email" id="adminEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="adminPass" placeholder="كلمة المرور">
    <button onclick="loginAdmin()" id="loginBtn">تسجيل الدخول</button>
    <div class="login-err" id="loginError"></div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <h1>لوحة <span>معراج</span></h1>
    <button class="logout-btn" onclick="logoutAdmin()">خروج 🚪</button>
  </div>
  
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('orders', this)">📋 الطلبات</button>
      <button class="tab-btn" onclick="switchTab('products', this)">📦 المنتجات</button>
      <button class="tab-btn" onclick="switchTab('reminders', this)">🔔 التذكيرات</button>
    </div>

    <!-- الطلبات -->
    <div id="view-orders" class="view active">
      <div class="toolbar">
        <div class="search-box"><input type="text" id="orderSearch" placeholder="ابحث بالاسم..." onkeyup="renderOrders()"></div>
        <button class="btn btn-pdf" onclick="exportPDF()">📄 تصدير PDF</button>
      </div>
      <div id="ordersList"></div>
    </div>

    <!-- المنتجات -->
    <div id="view-products" class="view">
      <div class="toolbar">
        <div class="search-box"><input type="text" id="productSearch" placeholder="ابحث عن منتج..." onkeyup="renderProducts()"></div>
        <button class="btn btn-add" onclick="openProductModal()">➕ إضافة منتج</button>
      </div>
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- التذكيرات -->
    <div id="view-reminders" class="view">
      <div class="table-wrap">
        <table>
          <thead><tr><th>المنتج المطلوب</th><th>وسيلة التواصل</th><th>التاريخ</th></tr></thead>
          <tbody id="remindersBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="productModal">
  <div class="modal-content">
    <h2 id="modalTitle">إضافة منتج</h2>
    <form id="productForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="form-group"><label>الاسم (تركي) *</label><input type="text" id="pNameTr" required></div>
        <div class="form-group"><label>الاسم (عربي)</label><input type="text" id="pNameAr"></div>
        <div class="form-group"><label>الاسم (إنجليزي)</label><input type="text" id="pNameEn"></div>
        <div class="form-group"><label>القسم</label><select id="pCategory"><option value="rings">خواتم</option><option value="bracelets">أساور</option><option value="necklaces">ميداليات</option><option value="other">أخرى</option></select></div>
        <div class="form-group"><label>السعر ₺ *</label><input type="number" id="pPrice" step="0.01" required></div>
        <div class="form-group"><label>الخصم %</label><input type="number" id="pDiscount" value="0"></div>
        <div class="form-group full"><label>رابط الصورة</label><input type="url" id="pImage"></div>
        <div class="form-group full"><label>الوصف</label><textarea id="pDesc" rows="2"></textarea></div>
        
        <div class="form-group full checkbox-group">
          <input type="checkbox" id="pInStock" checked>
          <label for="pInStock">المنتج متوفر</label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
        <button type="submit" class="btn-save" id="saveBtn">حفظ</button>
      </div>
    </form>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0-EP2Bi-zFZFMZIducA-HiEP8gr8Q6tI",
  authDomain: "miraj-new.firebaseapp.com",
  projectId: "miraj-new",
  storageBucket: "miraj-new.firebasestorage.app",
  messagingSenderId: "817739704878",
  appId: "1:817739704878:web:0d3c0d6e1f80ab8a784dbf"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.setPersistence(firebase.auth.Auth.Persistence.NONE); // يطلب دخول كل مرة

let allOrders = [], allProducts = [], allReminders = [];

auth.onAuthStateChanged(user => {
  if(user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }
});

function loginAdmin() {
  const email = document.getElementById('adminEmail').value;
  const pass = document.getElementById('adminPass').value;
  const btn = document.getElementById('loginBtn');
  btn.innerText = "..."; btn.disabled = true;
  auth.signInWithEmailAndPassword(email, pass).catch(e => {
    btn.innerText = "تسجيل الدخول"; btn.disabled = false;
    document.getElementById('loginError').innerText = "بيانات غير صحيحة";
  });
}
function logoutAdmin() { auth.signOut(); }

function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-' + id).classList.add('active');
}

function loadData() {
  db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(s => {
    allOrders = []; s.forEach(d => allOrders.push({id:d.id, ...d.data()}));
    renderOrders();
  });

  db.collection('products').orderBy('createdAt', 'desc').onSnapshot(s => {
    allProducts = []; s.forEach(d => allProducts.push({id:d.id, ...d.data()}));
    renderProducts();
  });

  db.collection('reminders').orderBy('createdAt', 'desc').onSnapshot(s => {
    allReminders = []; s.forEach(d => allReminders.push({id:d.id, ...d.data()}));
    renderReminders();
  });
}

function renderOrders() {
  const search = document.getElementById('orderSearch').value.toLowerCase();
  const box = document.getElementById('ordersList');
  let list = allOrders.filter(o => (o.name||'').toLowerCase().includes(search) || o.id.includes(search));
  
  if(!list.length) return box.innerHTML = '<p style="text-align:center;padding:20px;">لا توجد طلبات</p>';
  
  box.innerHTML = list.map(o => {
    const date = o.createdAt ? new Date(o.createdAt.toDate()).toLocaleString('ar-EG') : '';
    const items = (o.items||[]).map(i => `
      <div class="item-line">
        <span>${i.title.ar || i.title.tr} <b>(x${i.qty})</b></span>
        <span style="color:var(--gold);font-weight:bold;">₺ ${(i.finalPrice * i.qty).toFixed(2)}</span>
      </div>`).join('');
    const phone = (o.phone||'').replace(/[^0-9]/g, '');
    const wa = `https://wa.me/${phone.startsWith('0')?'9'+phone:phone.startsWith('90')?phone:'90'+phone}`;
    
    return `
    <div class="order-card">
      <div class="order-header">
        <div class="order-id">طلب #${o.id.slice(-6).toUpperCase()}</div>
        <div class="order-date">${date}</div>
      </div>
      <div class="order-body">
        <div class="order-details-col">
          <p><strong>الاسم:</strong> ${o.name}</p>
          <p><strong>الهاتف:</strong> <span style="direction:ltr; display:inline-block;">${o.phone}</span></p>
          <p><strong>العنوان:</strong> ${o.city} - ${o.address}</p>
          ${o.notes ? `<p><strong>ملاحظات:</strong> ${o.notes}</p>` : ''}
        </div>
        <div class="order-items-col">
          ${items}
        </div>
      </div>
      <div class="order-footer">
        <div class="total-box">الإجمالي: ₺ ${(o.total||0).toFixed(2)}</div>
        <div class="action-btns">
          <a href="${wa}" target="_blank" class="wa-btn">💬 واتساب</a>
          <button onclick="deleteOrder('${o.id}')" class="del-btn">🗑️ حذف</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function deleteOrder(id) {
  if(confirm("هل أنت متأكد من حذف هذا الطلب نهائياً؟")) {
    try { await db.collection('orders').doc(id).delete(); } 
    catch (error) { alert("حدث خطأ: " + error.message); }
  }
}

function exportPDF() {
  if(!allOrders.length) return alert("لا توجد طلبات لتصديرها.");
  
  const element = document.createElement('div');
  element.style.cssText = "padding:20px; font-family:'Cairo', sans-serif; direction:rtl; background:#fff; color:#000; width: 1000px;";
  
  let html = `
    <h2 style="text-align:center; color:#0f172a; margin-bottom:20px;">تقرير طلبات معراج</h2>
    <table style="width:100%; border-collapse:collapse; text-align:right; font-size:12px;">
      <thead>
        <tr style="background:#f1f5f9; border-bottom:2px solid #cbd5e1;">
          <th style="padding:10px; border:1px solid #e2e8f0;">#</th>
          <th style="padding:10px; border:1px solid #e2e8f0;">الاسم</th>
          <th style="padding:10px; border:1px solid #e2e8f0;">الهاتف</th>
          <th style="padding:10px; border:1px solid #e2e8f0;">المدينة</th>
          <th style="padding:10px; border:1px solid #e2e8f0;">العنوان</th>
          <th style="padding:10px; border:1px solid #e2e8f0;">المنتجات</th>
          <th style="padding:10px; border:1px solid #e2e8f0;">الإجمالي (₺)</th>
          <th style="padding:10px; border:1px solid #e2e8f0;">التاريخ</th>
        </tr>
      </thead>
      <tbody>
  `;
  
  allOrders.forEach((o, idx) => {
    const date = o.createdAt ? new Date(o.createdAt.toDate()).toLocaleDateString('ar-EG') : '';
    const itemsStr = (o.items||[]).map(i => `${i.title.ar || i.title.tr} (x${i.qty})`).join(' | ');
    
    html += `
      <tr>
        <td style="padding:10px; border:1px solid #e2e8f0; text-align:center;">${idx + 1}</td>
        <td style="padding:10px; border:1px solid #e2e8f0;">${o.name}</td>
        <td style="padding:10px; border:1px solid #e2e8f0; direction:ltr; text-align:right;">${o.phone}</td>
        <td style="padding:10px; border:1px solid #e2e8f0;">${o.city}</td>
        <td style="padding:10px; border:1px solid #e2e8f0;">${o.address}</td>
        <td style="padding:10px; border:1px solid #e2e8f0; font-size:11px;">${itemsStr}</td>
        <td style="padding:10px; border:1px solid #e2e8f0; text-align:center; font-weight:bold; color:#10b981;">${(o.total||0).toFixed(2)}</td>
        <td style="padding:10px; border:1px solid #e2e8f0; font-size:11px;">${date}</td>
      </tr>
    `;
  });
  
  html += `</tbody></table>`;
  element.innerHTML = html;
  
  const opt = {
    margin: 10,
    filename: `Miraj_Orders_${new Date().toISOString().slice(0,10)}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
  };
  
  html2pdf().set(opt).from(element).save();
}

function renderProducts() {
  const search = document.getElementById('productSearch').value.toLowerCase();
  const box = document.getElementById('productsGrid');
  let list = allProducts.filter(p => (p.title?.ar||p.title?.tr||'').toLowerCase().includes(search));
  
  if(!list.length) return box.innerHTML = '<p style="grid-column:1/-1;text-align:center;">لا توجد منتجات</p>';
  
  box.innerHTML = list.map(p => {
    const final = p.discount > 0 ? p.price * (1 - p.discount/100) : p.price;
    return `
    <div class="product-card">
      <img src="${p.image||'https://via.placeholder.com/300'}" class="p-img">
      <div class="p-info">
        <div class="p-title">${p.title?.ar || p.name}</div>
        <div class="p-price">₺ ${final.toFixed(2)} ${p.discount>0?`(-${p.discount}%)`:''}</div>
        <div class="p-stock ${p.inStock?'in':'out'}">${p.inStock?'✓ متوفر':'✗ غير متوفر'}</div>
        <div class="p-actions">
          <button class="btn-edit" onclick="openProductModal('${p.id}')">✏️ تعديل</button>
          <button class="btn-del-p" onclick="delProduct('${p.id}')">🗑️ حذف</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderReminders() {
  const body = document.getElementById('remindersBody');
  if(!allReminders.length) return body.innerHTML = '<tr><td colspan="3" style="text-align:center;">لا توجد تذكيرات</td></tr>';
  body.innerHTML = allReminders.map(r => `<tr><td>${r.productName}</td><td style="color:var(--accent);font-weight:700;">${r.contact}</td><td>${r.createdAt?new Date(r.createdAt.toDate()).toLocaleDateString('ar-EG'):''}</td></tr>`).join('');
}

function openProductModal(id=null) {
  document.getElementById('productForm').reset();
  document.getElementById('editId').value = '';
  if(id) {
    const p = allProducts.find(x=>x.id===id);
    document.getElementById('modalTitle').innerText = "تعديل المنتج";
    document.getElementById('editId').value = p.id;
    document.getElementById('pNameTr').value = p.title?.tr || p.name;
    document.getElementById('pNameAr').value = p.title?.ar || '';
    document.getElementById('pNameEn').value = p.title?.en || '';
    document.getElementById('pCategory').value = p.category || 'rings';
    document.getElementById('pPrice').value = p.price;
    document.getElementById('pDiscount').value = p.discount;
    document.getElementById('pImage').value = p.image;
    document.getElementById('pDesc').value = p.desc;
    document.getElementById('pInStock').checked = p.inStock !== false;
  } else {
    document.getElementById('modalTitle').innerText = "إضافة منتج";
    document.getElementById('pInStock').checked = true;
  }
  document.getElementById('productModal').classList.add('open');
}
function closeModal() { document.getElementById('productModal').classList.remove('open'); }

async function saveProduct(e) {
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const data = {
    name: document.getElementById('pNameTr').value,
    title: {
      tr: document.getElementById('pNameTr').value,
      ar: document.getElementById('pNameAr').value || document.getElementById('pNameTr').value,
      en: document.getElementById('pNameEn').value || document.getElementById('pNameTr').value
    },
    category: document.getElementById('pCategory').value,
    price: parseFloat(document.getElementById('pPrice').value),
    discount: parseFloat(document.getElementById('pDiscount').value)||0,
    image: document.getElementById('pImage').value,
    desc: document.getElementById('pDesc').value,
    inStock: document.getElementById('pInStock').checked
  };
  
  if(id) {
    await db.collection('products').doc(id).update(data);
  } else {
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('products').add(data);
  }
  closeModal();
}

async function delProduct(id) { 
  if(confirm("تأكيد حذف المنتج؟")) await db.collection('products').doc(id).delete(); 
}
</script>
